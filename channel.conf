# ETR Transit Tracker release channel -- the ONE file to edit when this moves.
# Sourced by release.sh. No secrets here: the Cloudflare API token and account
# ID live in the dotenv file next to this one (gitignored, never committed; see
# README "Credentials"), so the existing protections on dotenv files cover it.

# Public origin of the Pages site, no trailing slash. It is BAKED INTO EVERY
# FIRMWARE BUILD as the update address, so once devices are in the field it can
# only change by shipping a build that points at the new address first, while
# the old one still answers. Leave empty until the custom domain is attached;
# release.sh refuses to build or deploy without it.
SITE_URL=""

# Cloudflare Pages project (Workers & Pages -> the project name) and the branch
# that is its production deployment.
PAGES_PROJECT="etr-transit-tracker"
PAGES_BRANCH="main"

# The transit-data API the configurator defaults to. Users can change it under
# Advanced. Edmonton-only today.
PUBLIC_API_HOST="https://feeds.edmontontransitriders.org"

# Source repos. Relative paths resolve against this directory.
FIRMWARE_REPO="../transit-tracker"
COMPONENT_REPO="../esphome-transit-tracker"
CONFIGURATOR_REPO="/home/mickun/docker/web/transit-tracker-badge"

# Route Styles' published Edmonton badge codes and colours, served at
# /firmware/etr-defaults.json for the configurator's "Use ETR defaults" button.
# Copied in at every deploy, so a deploy picks up whatever is current there.
ETR_DEFAULTS_FILE="/home/mickun/docker/web/html/transit/firmware/etr-defaults.json"

# Pinned tool versions. Bump deliberately.
WRANGLER_VERSION="4.147.0"
NODE_IMAGE="node:24-alpine"
